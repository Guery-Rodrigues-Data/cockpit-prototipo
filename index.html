      <button type="button" class="avatar" data-action="toggle-user-menu" title="Usuário">D</button>
      <div class="user-menu-dropdown" id="userMenuDropdown">
        <button type="button" class="btn-text" data-action="clear-layout" title="Remove todos os widgets desta tela — volta ao primeiro acesso">Limpar Cockpit</button>

</header>

<div class="cockpit-toolbar">
  <div class="cockpit-toolbar-title">
    Cockpit
    <span>Painel operacional, Curitiba</span>
  </div>
  <div class="widget-library-wrap">
    <button type="button" class="btn-primary" data-action="toggle-library"><span id="iconAdd1"></span>Adicionar Widget</button>
    <div class="widget-library" id="widgetLibrary">
      <div class="widget-library-title">Biblioteca de Widgets</div>
      <button type="button" class="submenu-item" data-action="add-widget" data-type="mapa">
        <span class="submenu-item-icon" id="libIconMapa"></span>
        <span>
          <span class="submenu-item-title">Mapa <span class="submenu-item-tag" id="libTagMapa" hidden>Único</span></span>
          <span class="submenu-item-desc">Visualização geográfica e espacial interativa de dispositivos, subáreas e corredores.</span>
        </span>
      </button>
      <button type="button" class="submenu-item" data-action="add-widget" data-type="dispositivos">
        <span class="submenu-item-icon" id="libIconDispositivos"></span>
        <span>
          <span class="submenu-item-title">Dispositivos</span>
          <span class="submenu-item-desc">Monitoramento gerencial de quantitativo dos equipamentos.</span>
        </span>
      </button>
      <button type="button" class="submenu-item" data-action="add-widget" data-type="alertas">
        <span class="submenu-item-icon" id="libIconAlertas"></span>
        <span>
          <span class="submenu-item-title">Alertas</span>
          <span class="submenu-item-desc">Acompanhamento de falhas ativas.</span>
        </span>
      </button>
      <button type="button" class="submenu-item" data-action="add-widget" data-type="regioes">
        <span class="submenu-item-icon" id="libIconRegioes"></span>
        <span>
          <span class="submenu-item-title">Subáreas e Corredores</span>
          <span class="submenu-item-desc">Exibição dos dispositivos agrupados em subáreas ou corredores.</span>
        </span>
      </button>
    </div>
  </div>
</div>

<div class="cockpit-canvas">
  <div class="cockpit-empty" id="cockpitEmpty" hidden>
    <div class="cockpit-empty-inner">
      <div class="cockpit-empty-icon" id="iconEmptyDashboard"></div>
      <h2>Seu Cockpit está vazio</h2>
      <p>Monte seu painel operacional adicionando widgets pela Biblioteca — Mapa, Dispositivos, Alertas ou Subáreas e Corredores.</p>
      <button type="button" class="btn-primary" data-action="toggle-library"><span id="iconAdd2"></span>Adicionar Widget</button>
    </div>
  </div>
  <div class="grid-stack"></div>
</div>

<div class="modal-overlay" id="configModalOverlay">
  <div class="config-modal">
    <div class="config-modal-header">
      <strong id="configModalTitle">Configurar</strong>
      <button type="button" class="widget-icon-btn" data-action="modal-close" title="Fechar" id="modalCloseBtn"></button>
    </div>
    <div class="config-modal-body" id="configModalBody"></div>
    <div class="config-modal-actions">
      <button type="button" class="btn-secondary" data-action="modal-cancel">Cancelar</button>
      <button type="button" class="btn-primary" data-action="modal-save">Salvar</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/gridstack@9.5.1/dist/gridstack-all.js"></script>

<script src="assets/state.js"></script>
<script src="assets/map.js"></script>
<script src="assets/app.js"></script>
<script>
  // ícones que precisam do objeto ICONS (definido em app.js) já carregado
  document.getElementById("libIconMapa").innerHTML = ICONS.mapPin;
  document.getElementById("libIconDispositivos").innerHTML = ICONS.cpu;
  document.getElementById("libIconAlertas").innerHTML = ICONS.alertTriangle;
  document.getElementById("libIconRegioes").innerHTML = ICONS.layers;
  document.getElementById("modalCloseBtn").innerHTML = ICONS.x;
  document.getElementById("iconAdd1").innerHTML = ICONS.plus;
  document.getElementById("iconAdd2").innerHTML = ICONS.plus;
  document.getElementById("iconEmptyDashboard").innerHTML = ICONS.dashboard;
</script>
